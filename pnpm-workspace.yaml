packages:
  - themes/*
  - plugins/*
  - libs/*

catalog:
  '@types/uikit': 3.23.4
  happy-dom: 21.0.1
  nx: 23.3.0
  sass: 1.105.1
  typescript: 7.0.2
  uikit: 3.25.26
  vitest: 5.0.4

supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]
preferOffline: false
preferFrozenLockfile: false
sideEffectsCache: true
dedupePeerDependents: true
dedupePeers: true
minimumReleaseAgeStrict: true
allowBuilds:
  core-js: false
  es5-ext: false
  gifsicle: false
  jpegtran-bin: false
  mozjpeg: false
  nx: false
  '@parcel/watcher': false
  optipng-bin: false
  uglifyjs-webpack-plugin: false
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/exe.android-arm64'
  - '@pnpm/exe.android-x64'
  - '@pnpm/exe.darwin-arm64'
  - '@pnpm/exe.darwin-x64'
  - '@pnpm/exe.freebsd-x64'
  - '@pnpm/exe.linux-arm64-musl'
  - '@pnpm/exe.linux-arm64'
  - '@pnpm/exe.linux-ppc64'
  - '@pnpm/exe.linux-riscv64'
  - '@pnpm/exe.linux-s390x'
  - '@pnpm/exe.linux-x64-musl'
  - '@pnpm/exe.linux-x64'
  - '@pnpm/exe.win32-arm64'
  - '@pnpm/exe.win32-x64'
