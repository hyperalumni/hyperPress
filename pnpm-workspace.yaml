packages:
  - themes/*
  - plugins/*
  - libs/*

catalog:
  # Nx family — all @nx/* plugins must match the nx core version
  '@nx/oxlint': &nxVersion 23.3.0
  '@nx/vite': *nxVersion
  '@nx/workspace': *nxVersion
  '@types/uikit': 3.23.4
  # vitest family — coverage/ui plugins and the core must match
  '@vitest/coverage-v8': &vitestVersion 5.0.4
  '@vitest/ui': *vitestVersion
  fflate: 0.8.3
  happy-dom: 21.0.1
  nx: *nxVersion
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  sass: 1.105.1
  stylelint: 17.16.0
  stylelint-config-standard-scss: 17.0.0
  typescript: 7.0.2
  uikit: 3.25.26
  vite: 8.3.4
  vitest: *vitestVersion

supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]
preferOffline: false
preferFrozenLockfile: false
sideEffectsCache: true
dedupePeerDependents: true
dedupePeers: true
minimumReleaseAgeStrict: true
allowBuilds:
  core-js: false
  es5-ext: false
  gifsicle: false
  jpegtran-bin: false
  mozjpeg: false
  nx: true
  '@parcel/watcher': false
  optipng-bin: false
  uglifyjs-webpack-plugin: false
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/exe.android-arm64'
  - '@pnpm/exe.android-x64'
  - '@pnpm/exe.darwin-arm64'
  - '@pnpm/exe.darwin-x64'
  - '@pnpm/exe.freebsd-x64'
  - '@pnpm/exe.linux-arm64-musl'
  - '@pnpm/exe.linux-arm64'
  - '@pnpm/exe.linux-ppc64'
  - '@pnpm/exe.linux-riscv64'
  - '@pnpm/exe.linux-s390x'
  - '@pnpm/exe.linux-x64-musl'
  - '@pnpm/exe.linux-x64'
  - '@pnpm/exe.win32-arm64'
  - '@pnpm/exe.win32-x64'
