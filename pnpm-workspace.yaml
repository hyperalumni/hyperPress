packages:
  - 'themes/*'
  - 'plugins/*'
  - 'libs/*'
  - '!**/vendor/**'

catalog:
  # Nx family — all @nx/* plugins must match the nx core version
  '@nx/oxlint': &nxVersion 24.0.6
  '@nx/vite': *nxVersion
  '@nx/workspace': *nxVersion
  '@types/uikit': 3.23.4
  # vitest family — coverage/ui plugins and the core must match
  '@vitest/coverage-v8': &vitestVersion 5.1.0
  '@vitest/ui': *vitestVersion
  fflate: 0.8.3
  happy-dom: 21.0.4
  nx: *nxVersion
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  sass: 1.107.1
  stylelint: 17.16.0
  stylelint-config-standard-scss: 17.0.0
  typescript: 7.0.2
  uikit: 3.25.31
  vite: 8.3.8
  vitest: *vitestVersion

catalogs:
  # Foundation theme (gulp/webpack legacy stack); removable as one block
  foundation:
    '@babel/core': 8.1.2
    '@babel/preset-env': 8.0.7
    ansi-colors: 4.1.3
    babel-loader: 10.1.1
    browser-sync: 3.0.4
    dateformat: 5.0.5
    fancy-log: 2.0.0
    foundation-sites: 6.9.0
    gulp: 5.0.1
    gulp-autoprefixer: 10.0.0
    gulp-clean-css: 4.3.0
    gulp-cli: 3.1.0
    gulp-concat: 2.6.1
    gulp-extname: 0.2.2
    gulp-if: 3.0.0
    gulp-imagemin: 9.2.0
    gulp-phpcbf: 0.1.2
    gulp-phpcs: 3.1.0
    gulp-rename: 2.1.0
    gulp-rev: 12.0.0
    gulp-sass: 6.0.1
    gulp-sourcemaps: 3.0.0
    gulp-uglify: 3.0.2
    gulp-zip: 6.1.0
    imagemin-gifsicle: 7.0.0
    imagemin-jpegtran: 8.0.0
    imagemin-optipng: 8.0.0
    imagemin-svgo: 12.0.0
    jquery: 4.0.0
    js-yaml: 5.5.0
    motion-ui: 2.0.8
    panini: 1.7.2
    rimraf: 6.1.4
    sass-embedded: 1.107.1
    style-sherpa: 1.0.2
    vinyl-named: 1.1.0
    webpack: 5.112.2
    webpack-stream: 7.0.0
    what-input: 6.0.2
    yargs: 18.2.0

supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]
preferOffline: false
preferFrozenLockfile: false
sideEffectsCache: true
dedupePeerDependents: true
dedupePeers: true
minimumReleaseAgeStrict: true
allowBuilds:
  core-js: false
  es5-ext: false
  gifsicle: false
  jpegtran-bin: false
  mozjpeg: false
  nx: true
  '@parcel/watcher': false
  optipng-bin: false
  uglifyjs-webpack-plugin: false
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/exe.android-arm64'
  - '@pnpm/exe.android-x64'
  - '@pnpm/exe.darwin-arm64'
  - '@pnpm/exe.darwin-x64'
  - '@pnpm/exe.freebsd-x64'
  - '@pnpm/exe.linux-arm64-musl'
  - '@pnpm/exe.linux-arm64'
  - '@pnpm/exe.linux-ppc64'
  - '@pnpm/exe.linux-riscv64'
  - '@pnpm/exe.linux-s390x'
  - '@pnpm/exe.linux-x64-musl'
  - '@pnpm/exe.linux-x64'
  - '@pnpm/exe.win32-arm64'
  - '@pnpm/exe.win32-x64'
